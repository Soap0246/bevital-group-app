# BeVital — Supabase local development configuration.
# Run `npx supabase start` (requires Docker) then `npx supabase db reset`.

project_id = "bevital"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
# seed.sql      = reference data (safe everywhere)
# seed_dev.sql  = SYNTHETIC demo people. Local development only — never run against production.
sql_paths = ["./seed.sql", "./seed_dev.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "bevital://reset-password",
  "bevital://auth/callback",
  "exp://127.0.0.1:8081/--/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
# Email verification is required before sign-in.
enable_confirmations = true
secure_password_change = true

# Phone (SMS OTP) authentication is architected in the apps but disabled until an SMS
# provider (e.g. a Malaysian gateway through a Send-SMS hook, or Twilio) is configured.
[auth.sms]
enable_signup = false
enable_confirmations = true

# ───────── Edge Functions ─────────
[functions.create-payment-session]
verify_jwt = true

# Called by the payment provider (no Supabase JWT). Authenticated by the provider's HMAC signature.
[functions.payment-webhook]
verify_jwt = false

# Called by a Database Webhook, authenticated by a shared secret header.
[functions.send-push]
verify_jwt = false
